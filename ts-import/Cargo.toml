[package]
name = "rescript-ts-import"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Types TypeScript imports for ReScript: resolves an export with the tsrs checker and renders its type as ReScript declarations"
license = "LGPL-3.0"
repository = "https://github.com/rescript-lang/rescript"

[lib]
name = "rescript_ts_import"
path = "src/lib.rs"

# tsrs is the Rust port of the TypeScript compiler (Apache-2.0). Its crates are
# not published, so they are pinned to one commit of the repository.
[dependencies]
tsrs_core = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_vfs = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_tsoptions = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_checker = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_diagnostics = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_contentmapper = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }
tsrs_compiler = { git = "https://github.com/oxc-project/tsrs", rev = "cbbce5e33a2b57b44360f3aebd6f951011f67671" }

[profile.dev]
debug = false
