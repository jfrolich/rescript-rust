[package]
name = "rescript-ts-import-wasm"
version = "0.1.0"
edition = "2024"
publish = false
description = "The ReScript compiler with %ts imports as a WebAssembly module, for the examples of docs/ts-import"

# wasm32-wasip1, not wasm32-unknown-unknown: tsrs reads the clock, which only
# WASI provides. The page supplies the dozen WASI calls the module imports.
[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rescript-compiler = { path = "../../../compiler-rust", default-features = false, features = ["ts-import"] }
rescript-ts-import = { path = "../.." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
