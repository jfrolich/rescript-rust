<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An RFC for ReScript: a type declared with @instanceOf is identified by its JavaScript class, so packages that each declare Element can pass elements to each other and no package has to own the DOM types."
    />
    <meta property="og:title" content="Class types that packages can share" />
    <meta
      property="og:description"
      content="An RFC with live examples: the JavaScript class, not the declaration, decides what a class type is compatible with."
    />
    <meta property="og:type" content="article" />
    <title>Class types that packages can share · RFC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23153f35' stroke-width='1.65' stroke-linejoin='round'%3E%3Cpath d='M5 10.5 16 4l11 6.5v11L16 28 5 21.5Z'/%3E%3Cpath d='m5 10.5 11 6.3 11-6.3M16 16.8V28'/%3E%3C/svg%3E" />
    <script>
      // Before the first paint, so a chosen theme does not flash.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/classes.jsx"></script>
  </body>
</html>
