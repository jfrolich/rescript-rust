name: Rust rewrite validation

on:
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:
  # The trunk as well. A cache saved by a pull request run is visible to that
  # pull request alone, so the trunk runs are what save the OPAM, package and
  # Rust caches that pull requests start from.
  push:
    branches: [ocaml-to-rust-rewrite]

permissions:
  contents: read

concurrency:
  group: rust-rewrite-validation-${{ github.ref }}
  # A trunk run is left to finish, so that it saves its caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-warnings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --component clippy
      - name: Check all compiler targets and feature configurations
        run: |
          cargo clippy --locked --manifest-path compiler-rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path compiler-rust/Cargo.toml --all-targets --no-default-features -- -D warnings
      - name: Check compiler documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --manifest-path compiler-rust/Cargo.toml --all-features --no-deps

  release-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Test parity failure reporting
        run: |
          python3 scripts/test_js_output_fixture_reporting.py
          python3 scripts/test_typedtree_parity_exit.py

      # rust-toolchain.toml pins the toolchain of every Rust build here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Saved by trunk runs only (see the end of the job). Cargo rebuilds this
      # repository's crates after a fresh checkout whatever is restored, so
      # what a run gets from it is the compiled dependencies.
      - uses: actions/cache/restore@v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler-rust/target
            rewatch/target
          key: rewrite-release-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'compiler-rust/Cargo.lock', 'rewatch/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rewrite-release-v2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'compiler-rust/Cargo.lock', 'rewatch/Cargo.lock') }}-

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-linux-dependencies

      # The compiler crate is not built on its own here: the build system
      # links it, and the compiler test step below compiles it standalone.
      - name: Build release Rust compiler and build system
        id: rust-build
        run: |
          cargo build --release --locked --manifest-path rewatch/Cargo.toml
          ./scripts/rust_compiler_shims.sh release

      - uses: ./.github/actions/setup-ocaml
        with:
          compiler: "5.3.0"
          os: ubuntu-24.04
          cache-prefix: opam-rewrite-validation-v1

      - name: Build native reference compiler and libraries
        # Finds the rescript executable built above up to date.
        run: opam exec -- make lib

      - name: Compare exact CLI output filenames and marshal debug output
        run: |
          python3 scripts/test_bsc_output_filenames.py
          python3 scripts/test_marshal_debug_flags.py

      - name: Build native test corpus for compiler unit fixtures
        id: fixtures
        # The fixtures compile tests/tests sources file by file against .cmi
        # files, which only the OCaml reference build writes.
        run: |
          PROJECT_ROOT="$PWD" RUST_TARGET=release bash -c \
            'source scripts/parity_lib.sh && parity_build_ocaml_reference "$PROJECT_ROOT/tests/tests"'

      # The suite includes subprocess timing assertions. Run tests serially so
      # those benchmarks do not compete with one another for CPU time.
      # This step builds only the test binary, which nothing ships from, so it
      # skips link-time optimization: that is most of the build's time.
      - name: Test release Rust compiler
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
        run: cargo test --release --locked --manifest-path compiler-rust/Cargo.toml -- --test-threads=1

      - name: Test release build system
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: cargo test --release --locked --manifest-path rewatch/Cargo.toml

      - name: Typedtree parity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        # Diagnostic only; see "The Correctness Contract" in AGENTS.md.
        continue-on-error: true
        run: ./scripts/test_typedtree_parity.sh --release --parallel 2

      - name: Raw Lambda parity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        # Diagnostic only; see "The Correctness Contract" in AGENTS.md.
        continue-on-error: true
        run: ./scripts/test_lambda_parity.sh --release --raw --parallel 2

      - name: Optimized Lambda parity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        # Diagnostic only; see "The Correctness Contract" in AGENTS.md.
        continue-on-error: true
        run: ./scripts/test_lambda_parity.sh --release --parallel 2

      - name: JavaScript output parity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: ./scripts/test_js_output_parity.sh --release

      - name: Diagnostic parity
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        # Compare normal user-facing errors, not runtime-specific backtraces.
        run: env -u OCAMLRUNPARAM -u RUST_BACKTRACE ./scripts/test_error_output_parity.sh --release

      # Keep successful build artifacts even when a later assertion fails.
      # The job still fails; this only avoids rebuilding unchanged code.
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && steps.rust-build.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler-rust/target
            rewatch/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

      - name: Preserve failed parity diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: parity-diagnostics-${{ github.event.pull_request.number }}
          path: .parity-cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
