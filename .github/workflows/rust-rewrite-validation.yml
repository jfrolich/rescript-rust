name: Rust rewrite validation

on:
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:
  # The trunk as well. A cache saved by a pull request run is visible to that
  # pull request alone, so the trunk runs are what save the OPAM, package and
  # Rust caches that pull requests start from.
  push:
    branches: [ocaml-to-rust-rewrite]

permissions:
  contents: read

concurrency:
  group: rust-rewrite-validation-${{ github.ref }}
  # A trunk run is left to finish, so that it saves its caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"
  # Everything here checks behaviour, which link-time optimization does not
  # change, and fat LTO is most of a release build's time. The Instruction
  # count workflow builds the shipped configuration.
  CARGO_PROFILE_RELEASE_LTO: "off"

# `build` makes the rescript executable that the parity jobs and the
# compiler tests use; the build system tests compile on their own meanwhile.
jobs:
  compiler-warnings:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --component clippy
      - name: Check all compiler targets and feature configurations
        run: |
          cargo clippy --locked --manifest-path compiler-rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path compiler-rust/Cargo.toml --all-targets --no-default-features -- -D warnings
      - name: Check compiler documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --manifest-path compiler-rust/Cargo.toml --all-features --no-deps

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the toolchain of every Rust build here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Only the compiled dependencies are cached: Cargo rebuilds this
      # repository's crates after a fresh checkout whatever is restored.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rewatch -> target
          shared-key: validation-release
          save-if: ${{ github.event_name == 'push' }}

      - name: Build release Rust compiler and build system
        run: |
          cargo build --release --locked --manifest-path rewatch/Cargo.toml
          tar -cf rescript.tar rewatch/target/release/rescript

      - uses: actions/upload-artifact@v7
        with:
          name: rescript
          path: rescript.tar
          retention-days: 3

  build-system-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rewatch -> target
          shared-key: validation-release
          save-if: false

      - uses: ./.github/actions/setup-node

      - name: Test release build system
        run: cargo test --release --locked --manifest-path rewatch/Cargo.toml

      # The parity scripts' own tests, here because this job needs no
      # executable and finishes before the parity jobs.
      - name: Test parity failure reporting
        run: |
          python3 scripts/test_js_output_fixture_reporting.py
          python3 scripts/test_typedtree_parity_exit.py
          python3 scripts/test_parser_ast0_parity_exit.py
          python3 scripts/test_parser_ast_parity_exit.py
          python3 scripts/test_error_output_parity_exit.py

  compiler-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler-rust -> target
          shared-key: validation-compiler-tests
          save-if: ${{ github.event_name == 'push' }}

      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-linux-dependencies

      # The same OCaml as ci.yml: diagnostics are laid out by OCaml's Format,
      # whose break sizing changed in 5.5, and the Rust formatter follows it.
      - uses: ./.github/actions/setup-ocaml
        with:
          compiler: "5.5.2"
          os: ubuntu-24.04
          cache-prefix: opam-rewrite-validation-v1

      - uses: ./.github/actions/download-rescript

      - name: Build native reference compiler and libraries
        # Finds the downloaded rescript executable up to date.
        run: opam exec -- make lib

      - name: Build native test corpus for compiler unit fixtures
        # The fixtures compile tests/tests sources file by file against .cmi
        # files, which only the OCaml reference build writes.
        run: |
          PROJECT_ROOT="$PWD" RUST_TARGET=release bash -c \
            'source scripts/parity_lib.sh && parity_build_ocaml_reference "$PROJECT_ROOT/tests/tests"'

      # The suite includes subprocess timing assertions. Run tests serially so
      # those benchmarks do not compete with one another for CPU time.
      - name: Test release Rust compiler
        run: cargo test --release --locked --manifest-path compiler-rust/Cargo.toml -- --test-threads=1

  # The parity suites that gate a change (see "The Correctness Contract" in
  # AGENTS.md), each its own check so that a pull request shows which one
  # failed. They run side by side, and finish before the compiler tests.
  parity:
    name: parity (${{ matrix.suite }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: javascript
            run: |
              python3 scripts/test_bsc_output_filenames.py
              python3 scripts/test_marshal_debug_flags.py
              ./scripts/test_js_output_parity.sh --release
          - suite: diagnostics
            # Compare normal user-facing errors, not runtime-specific backtraces.
            run: env -u OCAMLRUNPARAM -u RUST_BACKTRACE ./scripts/test_error_output_parity.sh --release
          - suite: stdlib
            run: RUST_TARGET=release ./scripts/test_stdlib_output_parity.sh
          - suite: gentype
            # The in-repo suites; the Tella suite needs a private checkout.
            run: |
              GENTYPE_PARITY_WITHOUT_TELLA=1 \
              REWATCH_BIN="$PWD/rewatch/target/release/rescript" \
              RUST_BSC="$PWD/rewatch/target/release/bsc" \
                ./scripts/test_gentype_output_parity.sh
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-linux-dependencies
      - uses: ./.github/actions/setup-ocaml
        with:
          compiler: "5.5.2"
          os: ubuntu-24.04
          cache-prefix: opam-rewrite-validation-v1

      - uses: ./.github/actions/download-rescript

      - name: Build native reference compiler and libraries
        run: opam exec -- make lib

      # Cases that read the runtime's or Belt's compiled files (such as
      # `-I packages/@rescript/belt/lib/ocaml`) need the OCaml compiler's.
      - name: Build the runtime and Belt with the OCaml compiler
        run: |
          PROJECT_ROOT="$PWD" RUST_TARGET=release bash -c \
            'source scripts/parity_lib.sh && parity_build_ocaml_reference "$PROJECT_ROOT/tests/tests"'

      - name: ${{ matrix.suite }} parity
        run: ${{ matrix.run }}

      - name: Preserve failed parity diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ matrix.suite }}-${{ github.event.pull_request.number || github.sha }}
          path: .parity-cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Diagnostic only; see "The Correctness Contract" in AGENTS.md. These help
  # find the layer a JavaScript or diagnostic difference starts in.
  ir-parity:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-linux-dependencies
      - uses: ./.github/actions/setup-ocaml
        with:
          compiler: "5.5.2"
          os: ubuntu-24.04
          cache-prefix: opam-rewrite-validation-v1

      - uses: ./.github/actions/download-rescript

      - name: Build native reference compiler and libraries
        run: opam exec -- make lib

      - name: Typedtree parity
        continue-on-error: true
        run: ./scripts/test_typedtree_parity.sh --release --parallel 4

      - name: Raw Lambda parity
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./scripts/test_lambda_parity.sh --release --raw --parallel 4

      - name: Optimized Lambda parity
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: ./scripts/test_lambda_parity.sh --release --parallel 4
