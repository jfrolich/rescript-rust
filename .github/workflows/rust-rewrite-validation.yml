name: Rust rewrite validation

on:
  # Every pull request, including ones stacked on another PR's branch.
  pull_request:
  # The trunk as well. A cache saved by a pull request run is visible to that
  # pull request alone, so the trunk runs are what save the OPAM, OCaml and
  # Rust caches that pull requests start from.
  push:
    branches: [ocaml-to-rust-rewrite]

permissions:
  contents: read

concurrency:
  group: rust-rewrite-validation-${{ github.ref }}
  # A trunk run is left to finish, so that it saves its caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"
  # Everything here checks behaviour, which link-time optimization does not
  # change, and fat LTO is most of a release build's time. The Instruction
  # count workflow builds the shipped configuration.
  CARGO_PROFILE_RELEASE_LTO: "off"
  # Keep rustc's incremental state in the cached target directories, so a
  # pull request recompiles what it changed rather than whole crates.
  CARGO_PROFILE_RELEASE_INCREMENTAL: "true"
  # Decide whether a file changed by its contents, not its mtime: a fresh
  # checkout dates every file now, which would make every restored crate
  # stale. A nightly Cargo flag; rust-toolchain.toml pins a nightly.
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: "true"

# How the jobs overlap, on 4-CPU Arm runners:
#
#   build ──────────────┬─> parity (4 suites)
#   ocaml ──────────────┘
#   compiler-tests: compiles its tests, then waits for build and ocaml
#   build-system-tests, script-tests, compiler-warnings, playground-wasm: on
#   their own
#
# Rust target directories are cached by trunk runs and restored by pull
# requests (build-system-tests saves the release one, compiler-tests the dev
# one), so a pull request compiles what changed against the trunk.
jobs:
  # Warning-free Clippy and rustdoc for the compiler crate. Its check
  # artifacts are cached by trunk runs like the other Rust targets.
  compiler-warnings:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --component clippy

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler-rust/target
          key: validation-compiler-warnings-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compiler-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            validation-compiler-warnings-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compiler-rust/Cargo.lock') }}-
            validation-compiler-warnings-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Check all compiler targets and feature configurations
        run: |
          cargo clippy --locked --manifest-path compiler-rust/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path compiler-rust/Cargo.toml --all-targets --no-default-features -- -D warnings
      - name: Check compiler documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --manifest-path compiler-rust/Cargo.toml --all-features --no-deps

      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler-rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The playground calls the compiler as a library and builds only for wasm,
  # so nothing else here notices when a compiler API change breaks it.
  playground-wasm:
    name: Playground wasm check
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned Rust toolchain with the wasm target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            playground/crate/target
          key: validation-playground-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'playground/crate/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            validation-playground-wasm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'playground/crate/Cargo.lock') }}
            validation-playground-wasm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Check the playground crate against the compiler API
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo check --locked --manifest-path playground/crate/Cargo.toml --target wasm32-unknown-unknown

      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            playground/crate/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      # rust-toolchain.toml pins the toolchain of every Rust build here.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rewatch/target
          key: validation-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rewatch/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            validation-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rewatch/Cargo.lock') }}-
            validation-release-v1-${{ runner.os }}-${{ runner.arch }}-

      # js-reformat is what the oxc printer parity suites compare with. It
      # shares the target directory so that it is cached and shipped with
      # the compiler.
      - name: Build release Rust compiler, build system and JS reformatter
        run: |
          cargo build --release --locked --manifest-path rewatch/Cargo.toml
          cargo build --release --locked --manifest-path scripts/js-reformat/Cargo.toml --target-dir rewatch/target
          tar -cf rescript.tar rewatch/target/release/rescript rewatch/target/release/js-reformat

      - uses: actions/upload-artifact@v7
        with:
          name: rescript
          path: rescript.tar
          retention-days: 3

  # The OCaml reference compiler and parser. They change rarely, so they are
  # cached by the sources dune builds them from, and OPAM is only set up when
  # that cache misses.
  ocaml:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      OCAML_VERSION: "5.5.2"
    steps:
      - uses: actions/checkout@v6

      - name: Hash the OCaml sources
        id: sources
        run: |
          # The files the Makefile's dune build depends on.
          hash=$({
            echo "$OCAML_VERSION"
            git ls-files -s -- compiler analysis tools rewatch-ocaml tests |
              awk '$4 ~ /(\.(ml|mli|c|h|dune)|\/dune|\/dune-project)$/'
            git ls-files -s -- dune-project dune '*.opam'
          } | sha256sum | cut -c1-32)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        id: cached
        with:
          path: ocaml-bin
          key: ocaml-reference-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.sources.outputs.hash }}

      - uses: ./.github/actions/setup-ocaml
        if: ${{ steps.cached.outputs.cache-hit != 'true' }}
        with:
          compiler: ${{ env.OCAML_VERSION }}
          os: ubuntu-24.04-arm
          cache-prefix: opam-rewrite-validation-v1

      - name: Build the OCaml compiler and parser
        if: ${{ steps.cached.outputs.cache-hit != 'true' }}
        run: |
          opam exec -- dune build compiler/bsc/rescript_compiler_main.exe compiler/syntax/cli/res_cli.exe
          mkdir -p ocaml-bin
          cp _build/default/compiler/bsc/rescript_compiler_main.exe ocaml-bin/bsc
          cp _build/default/compiler/syntax/cli/res_cli.exe ocaml-bin/res_parser

      # Saved by pull requests too: the cache is small, and keyed by content.
      - uses: actions/cache/save@v5
        if: ${{ steps.cached.outputs.cache-hit != 'true' }}
        with:
          path: ocaml-bin
          key: ${{ steps.cached.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: ocaml
          path: ocaml-bin
          retention-days: 3

  build-system-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rewatch/target
          key: validation-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rewatch/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            validation-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rewatch/Cargo.lock') }}-
            validation-release-v1-${{ runner.os }}-${{ runner.arch }}-

      - uses: ./.github/actions/setup-node

      # Builds what the build job builds, and the tests on top.
      - name: Test release build system
        run: |
          cargo build --release --locked --manifest-path rewatch/Cargo.toml
          cargo test --release --locked --manifest-path rewatch/Cargo.toml

      - name: Check signature publication and stored interface determinism
        run: python3 scripts/test_signature_publication.py

      # This job saves the release cache rather than the build job, which
      # the parity jobs wait for: saving a gigabyte takes a while.
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rewatch/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The same build-system tests on macOS. Linux and macOS differ where the
  # build touches the file system (file locks, rename, case folding), and a
  # change that hangs or fails only there is otherwise seen by nobody: every
  # other job runs on Linux.
  build-system-tests-macos:
    name: build-system-tests (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rewatch/target
          key: validation-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rewatch/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            validation-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'rewatch/Cargo.lock') }}-
            validation-release-v1-${{ runner.os }}-${{ runner.arch }}-

      - uses: ./.github/actions/setup-node

      - name: Test release build system
        run: |
          cargo build --release --locked --manifest-path rewatch/Cargo.toml
          cargo test --release --locked --manifest-path rewatch/Cargo.toml

      - name: Check signature publication and stored interface determinism
        run: python3 scripts/test_signature_publication.py

      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rewatch/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The parity scripts' own tests. They need nothing built.
  script-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Test parity failure reporting
        run: |
          status=0
          pids=()
          for test in test_js_output_fixture_reporting test_error_output_parity_exit; do
            python3 "scripts/$test.py" > "$RUNNER_TEMP/$test.log" 2>&1 &
            pids+=("$!:$test")
          done
          for entry in "${pids[@]}"; do
            test=${entry#*:}
            if wait "${entry%%:*}"; then
              echo "::group::$test passed"
            else
              status=1
              echo "::group::$test FAILED"
            fi
            cat "$RUNNER_TEMP/$test.log"
            echo "::endgroup::"
          done
          exit $status

      - name: Test build comparison layouts
        run: python3 scripts/test_build_comparison_layouts.py

      - name: Test printer parity aggregation and ratchets
        run: python3 -m unittest discover -s scripts -p test_printer_parity_test.py

      - name: Test the worker-count determinism gate
        run: python3 -m unittest discover -s scripts -p test_worker_determinism_test.py

      - name: Test the derived-code census summary
        run: python3 -m unittest discover -s scripts -p test_derived_census_summary.py

      - name: Test the sequential instruction comparison
        run: python3 -m unittest discover -s scripts -p test_compare_build_instructions.py

      - name: Test the check-mode comparison rule
        run: python3 -m unittest discover -s scripts -p test_check_modes_gate.py

      # Every lowering function a change adds or rewrites states its cost.
      # The base is the pull request's, or the trunk commit before the push;
      # the checkout has neither, so it is fetched first.
      - name: Check cost notes of changed lowering functions
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 scripts/check_lowering_cost_docs.py --self-test --base "$BASE"

  compiler-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      contents: read
      # To see when the build and ocaml jobs have uploaded their artifacts.
      actions: read
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler-rust/target
          key: validation-compiler-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compiler-rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            validation-compiler-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'compiler-rust/Cargo.lock') }}-
            validation-compiler-tests-v1-${{ runner.os }}-${{ runner.arch }}-

      # The tests run in half a second; building them is the cost, and a
      # dev build is the faster one.
      - name: Build the Rust compiler tests
        run: cargo test --locked --no-run --manifest-path compiler-rust/Cargo.toml

      - uses: actions/cache/save@v5
        if: ${{ github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            compiler-rust/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - uses: ./.github/actions/setup-node

      # The tests read .cmi files of tests/tests that only the OCaml compiler
      # writes, so they need the other jobs' executables. Rather than
      # waiting for those jobs before starting, this job builds the tests
      # meanwhile and waits here.
      - name: Wait for the build and ocaml jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          deadline=$((SECONDS + 1800))
          until names=$(gh api "$api/artifacts" --jq '.artifacts[].name') &&
                grep -qx rescript <<< "$names" && grep -qx ocaml <<< "$names"; do
            failed=$(gh api "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs" --jq \
              '.jobs[] | select((.name == "build" or .name == "ocaml") and .status == "completed" and .conclusion != "success") | .name' || true)
            if [[ -n "$failed" ]]; then
              echo "::error::No executables to test with: job $failed failed"
              exit 1
            fi
            if (( SECONDS > deadline )); then
              echo "::error::Timed out waiting for the build and ocaml jobs"
              exit 1
            fi
            sleep 10
          done

      - uses: ./.github/actions/prepare-parity

      # The suite includes subprocess timing assertions. Run tests serially so
      # those benchmarks do not compete with one another for CPU time.
      - name: Test Rust compiler
        run: cargo test --locked --manifest-path compiler-rust/Cargo.toml -- --test-threads=1

  backend-coverage:
    name: Backend bridge coverage
    needs: [build, ocaml]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/prepare-parity
      - name: Check Lambda bridge identity and coverage ratchet
        run: |
          python3 -m unittest discover -s scripts -p test_backend_coverage_test.py
          python3 scripts/test_backend_coverage.py
      # Units the rewritten type checker declines, per corpus and reason:
      # a count may fall, never rise.
      - name: Check checker coverage ratchet
        run: |
          python3 scripts/test_tc_coverage.py
          python3 scripts/tc_coverage.py --rescript rewatch/target/release/rescript

  # Fingerprint, item digests and encoded bytes computed from the frozen
  # shared graph must equal those of the portable form, unit by unit.
  signature-equality:
    name: Signature equality
    needs: [build, ocaml]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/prepare-parity
      - name: Compare portable and frozen shared signatures
        run: |
          python3 -m unittest discover -s scripts -p test_signature_equality_test.py
          python3 scripts/test_signature_equality.py

      # The names replay of RESCRIPT_CHECKER=both runs only in a build with
      # debug assertions; a release one compares the published signatures
      # alone. No job has such a build, and this one is short.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build the debug rescript
        run: cargo build --locked --manifest-path rewatch/Cargo.toml

      # Both checkers on every unit of the runtime and tests/tests, with every
      # name lookup of the old checker replayed on the new scope tables. Last,
      # as it rebuilds what prepare-parity built.
      - name: Compare the old and new checkers and replay their name lookups
        run: |
          root="$PWD"
          rescript="$root/rewatch/target/debug/rescript"
          export RESCRIPT_RUNTIME="$root/packages/@rescript/runtime"
          export RESCRIPT_CHECKER=both RAYON_NUM_THREADS=1
          log="$RUNNER_TEMP/checker-both.log"
          : > "$log"
          for project in "$RESCRIPT_RUNTIME" "$root/tests/tests"; do
            if ! (cd "$project" && "$rescript" clean . && "$rescript" -vv build .) >> "$log" 2>&1; then
              grep -v -e 'tc-names-replayed ' -e 'tc-declined ' "$log" | tail -n 100
              echo "::error::The RESCRIPT_CHECKER=both build of $project failed"
              exit 1
            fi
          done
          read -r units lookups < <(awk '$2 == "tc-names-replayed" { n++; s += $NF } END { print n + 0, s + 0 }' "$log")
          echo "Names replayed for $units units, $lookups lookups"
          if (( units == 0 )); then
            echo "::error::No unit was replayed: the rescript executable has no debug assertions"
            exit 1
          fi

  # A derived declaration compiled from its plan must give what its general
  # form gives: diagnostics, warnings, signature, JavaScript and exports.
  derived-check:
    name: Derived code check
    needs: [build, ocaml]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/prepare-parity
      - name: Compile derived items both ways and compare
        run: |
          export RESCRIPT_RUNTIME="$PWD/packages/@rescript/runtime"
          rewatch/target/release/rescript clean tests/ppx_spice
          RESCRIPT_DERIVED_PATH=check \
            rewatch/target/release/rescript build tests/ppx_spice
      # A unit of a package below the build root, compiled again with
      # locations: the reference compile needs the unit's source.
      - name: Compile derived items of a monorepo package both ways and compare
        run: |
          export RESCRIPT_RUNTIME="$PWD/packages/@rescript/runtime"
          mkdir -p tests/ppx_spice_monorepo/node_modules/@derived-code-monorepo
          ln -sfn ../../packages/shared tests/ppx_spice_monorepo/node_modules/@derived-code-monorepo/shared
          rewatch/target/release/rescript clean tests/ppx_spice_monorepo
          RESCRIPT_DERIVED_PATH=check \
            rewatch/target/release/rescript build tests/ppx_spice_monorepo
      # The diagnostics and warnings of derived code, from plans, from the
      # general form, and compared both ways.
      - name: Diagnostics of derived code
        run: |
          node tests/build_tests/super_errors_derived/input.js
          RESCRIPT_DERIVED_PATH=general node tests/build_tests/super_errors_derived/input.js
          RESCRIPT_DERIVED_PATH=check node tests/build_tests/super_errors_derived/input.js

  # A dependency served from the prebuilt snapshot must give the JavaScript,
  # diagnostics and stored records that compiling it from source gives.
  snapshot-equivalence:
    name: Snapshot equivalence
    needs: [build, ocaml]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/prepare-parity
      # The snapshot embedded in the executable must be what the runtime and
      # Belt sources of this commit produce.
      - name: Check embedded snapshot freshness
        run: |
          RESCRIPT_RUNTIME="$PWD/packages/@rescript/runtime" \
            rewatch/target/release/rescript snapshot --check

      - name: Compare snapshot and from-source builds
        run: |
          export RESCRIPT_RUNTIME="$PWD/packages/@rescript/runtime"
          # The two projects whose dependencies this job has; the script's
          # default list adds a workspace that needs its own package install.
          RESCRIPT_EXECUTABLE="$PWD/rewatch/target/release/rescript" \
            ./scripts/test_snapshot_equivalence.sh tests/belt_tests tests/tests

  # The output suites again with the Rust side printed by the opt-in oxc
  # printer: JavaScript is compared with the OCaml reference after
  # reformatting both, and a per-corpus ratchet
  # (compiler-rust/tests/printer_coverage.json) fails when fewer outputs go
  # through oxc or a new fallback reason appears.
  printer-parity:
    name: oxc parity (${{ matrix.suite }})
    needs: [build, ocaml]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [js, stdlib, gentype]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/prepare-parity

      - name: Oxc output parity and coverage ratchet
        run: |
          export PARITY_REFORMAT_BIN="$PWD/rewatch/target/release/js-reformat"
          export RUST_TARGET=release
          export REWATCH_BIN="$PWD/rewatch/target/release/rescript"
          export RUST_BSC="$PWD/rewatch/target/release/bsc"
          export GENTYPE_PARITY_WITHOUT_TELLA=1
          ./scripts/test_${{ matrix.suite }}_output_parity.sh --printer oxc

      - name: Preserve failed printer comparison diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: printer-parity-${{ matrix.suite }}-${{ github.event.pull_request.number || github.sha }}
          path: .parity-cache/printer
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # The parity suites that gate a change (see "The Correctness Contract" in
  # AGENTS.md), each its own check so that a pull request shows which one
  # failed.
  parity:
    name: parity (${{ matrix.suite }})
    needs: [build, ocaml]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: javascript
            run: |
              python3 scripts/test_bsc_output_filenames.py
              python3 scripts/test_marshal_debug_flags.py
              ./scripts/test_js_output_parity.sh --release
              python3 scripts/test_stored_interface_determinism.py
              python3 scripts/test_worker_determinism.py
          - suite: diagnostics
            # Compare normal user-facing errors, not runtime-specific backtraces.
            # Then each super_errors fixture checked as usual (with a recheck
            # after an error) must report what forced Explain mode reports.
            run: |
              env -u OCAMLRUNPARAM -u RUST_BACKTRACE ./scripts/test_error_output_parity.sh --release
              python3 scripts/test_check_modes.py --rescript rewatch/target/release/rescript --runtime packages/@rescript/runtime
          - suite: stdlib
            run: RUST_TARGET=release ./scripts/test_stdlib_output_parity.sh
          - suite: gentype
            # The in-repo suites; the Tella suite needs a private checkout.
            run: |
              GENTYPE_PARITY_WITHOUT_TELLA=1 \
              REWATCH_BIN="$PWD/rewatch/target/release/rescript" \
              RUST_BSC="$PWD/rewatch/target/release/bsc" \
                ./scripts/test_gentype_output_parity.sh
          - suite: analysis
            # The Rust editor analysis against the OCaml analysis snapshots,
            # and `rescript-tools doc` and `rescript-tools reanalyze` against
            # the OCaml doc and reanalyze snapshots.
            run: |
              ./tests/analysis_tests/no-watcher.sh
              ./tests/analysis_tests/test-rust.sh
              ./tests/tools_tests/test-doc-rust.sh
              ./tests/analysis_tests/tests-reanalyze/test-rust.sh
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/prepare-parity

      - name: ${{ matrix.suite }} parity
        run: ${{ matrix.run }}

      - name: Preserve failed parity diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: parity-${{ matrix.suite }}-${{ github.event.pull_request.number || github.sha }}
          path: .parity-cache
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
