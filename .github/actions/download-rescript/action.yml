name: Download the rescript executable
description: >-
  Put the release rescript executable that the build job of this run made at
  rewatch/target/release, with the bsc and res_parser_rust wrappers next to it.

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8
      with:
        name: rescript

    # -m dates the executable now, after the checkout, so make finds it newer
    # than its sources and does not rebuild it.
    - name: Unpack the executable
      shell: bash
      run: |
        tar -xmf rescript.tar
        rm rescript.tar
        ./scripts/rust_compiler_shims.sh release
