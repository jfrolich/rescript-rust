[package]
name = "rescript-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ReScript compiler - Rust implementation"
license = "LGPL-3.0"
repository = "https://github.com/rescript-lang/rescript"

[lib]
name = "rescript_compiler"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Data structures
typed-arena = "2.0"
ahash = { version = "0.8", features = ["serde"] }
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
im-rc = "15.1"
indexmap = { version = "2.0", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
smallvec = { version = "1.15", features = ["union", "const_generics"] }
elsa = "1.11"

# Utilities
log = "0.4"
tracing = "0.1"

# CLI (not needed for WASM)
clap = { version = "4.5", features = ["derive"], optional = true }

# JavaScript parsing (for classify_exp in PPX)
oxc_allocator = "0.49"
oxc_parser = "0.49"
oxc_ast = "0.49"
oxc_span = "0.49"

[dev-dependencies]
rayon = "1.10"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.40", features = ["json"] }
tempfile = "3"

[features]
default = ["native"]
native = ["clap"]
wasm = []

[profile.release]
# As in rewatch/Cargo.toml, whose profile applies when rewatch builds this
# crate: fat LTO, and the default number of codegen units.
lto = true

[profile.dev]
# Fast compilation for development
opt-level = 0
# Line tables keep file:line in backtraces and profiles but drop variable and
# type info: about 30% smaller target dirs and faster builds. For a debugger
# session with locals, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Benchmarks will be added later
# [[bench]]
# name = "parser_bench"
# harness = false
#
# [[bench]]
# name = "compile_bench"
# harness = false
