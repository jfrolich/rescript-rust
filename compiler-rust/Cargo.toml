[package]
name = "rescript-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ReScript compiler - Rust implementation"
license = "LGPL-3.0"
repository = "https://github.com/rescript-lang/rescript"

[lib]
name = "rescript_compiler"
path = "src/lib.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Data structures
typed-arena = "2.0"
ahash = { version = "0.8", features = ["serde"] }
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
im-rc = "15.1"
indexmap = { version = "2.0", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
smallvec = { version = "1.15", features = ["union", "const_generics"] }
elsa = "1.11"

# Utilities
log = "0.4"
tracing = "0.1"

# CLI (not needed for WASM)
clap = { version = "4.5", features = ["derive"], optional = true }

# JavaScript parsing and experimental AST emission (shared with js-reformat)
oxc_allocator = "=0.158.0"
oxc_parser = "=0.158.0"
oxc_ast = "=0.158.0"
oxc_span = "=0.158.0"
oxc_codegen = "=0.158.0"
oxc_syntax = "=0.158.0"
oxc_ast_visit = "=0.158.0"

# `%ts` imports: types from the TypeScript checker (tsrs)
rescript-ts-import = { path = "../ts-import", optional = true }

[dev-dependencies]
allocation-counter = "0.8.1"
js-reformat = { path = "../scripts/js-reformat" }
rayon = "1.10"
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.40", features = ["json"] }
tempfile = "3"

[features]
default = ["native", "ts-import"]
native = ["clap"]
wasm = []
# Typed imports from TypeScript (src/ts_import.rs). Links tsrs, the Rust port
# of the TypeScript compiler; without it `%ts` is an unknown extension.
ts-import = ["dep:rescript-ts-import"]
# Explicit opt-in for end-to-end tests; absent from shipping builds.
test-hooks = []

[profile.release]
# As in rewatch/Cargo.toml, whose profile applies when rewatch builds this
# crate: fat LTO, and the default number of codegen units.
lto = true

[profile.dev]
# Fast compilation for development
opt-level = 0
# Line tables keep file:line in backtraces and profiles but drop variable and
# type info: about 30% smaller target dirs and faster builds. For a debugger
# session with locals, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"

# Benchmarks will be added later
# [[bench]]
# name = "parser_bench"
# harness = false
#
# [[bench]]
# name = "compile_bench"
# harness = false

[[bench]]
name = "tc_kernel"
harness = false
