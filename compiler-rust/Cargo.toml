[package]
name = "rescript-compiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ReScript compiler - Rust implementation"
license = "LGPL-3.0"
repository = "https://github.com/rescript-lang/rescript"

[lib]
name = "rescript_compiler"
path = "src/lib.rs"

# Parser CLI for testing (matches OCaml res_parser interface)
[[bin]]
name = "res_parser_rust"
path = "src/bin/res_parser.rs"

[[bin]]
name = "bsc"
path = "src/bin/bsc.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Concurrency (not available in WASM)
rayon = { version = "1.10", optional = true }
dashmap = { version = "6.0", optional = true }

# Data structures
typed-arena = "2.0"
ahash = "0.8"
im-rc = "15.1"
indexmap = { version = "2.0", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
elsa = "1.11"

# Utilities
log = "0.4"
env_logger = { version = "0.11", optional = true }
tracing = "0.1"

# CLI (not needed for WASM)
clap = { version = "4.5", features = ["derive"], optional = true }

# JavaScript parsing (for classify_exp in PPX)
oxc_allocator = "0.49"
oxc_parser = "0.49"
oxc_ast = "0.49"
oxc_span = "0.49"

# WASM support
wasm-bindgen = { version = "0.2", optional = true }

# JavaScript engine for @comptime.inline evaluation
boa_engine = { version = "0.21", optional = true }

[dev-dependencies]
proptest = "1.5"
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1.40", features = ["json"] }
tempfile = "3"

[features]
default = ["native", "comptime-inline"]
native = ["rayon", "dashmap", "env_logger", "clap"]
wasm = ["wasm-bindgen", "comptime-inline"]
comptime-inline = ["boa_engine"]

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
# Fast compilation for development
opt-level = 0
debug = true

# Benchmarks will be added later
# [[bench]]
# name = "parser_bench"
# harness = false
#
# [[bench]]
# name = "compile_bench"
# harness = false
