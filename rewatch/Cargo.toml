[package]
name = "rescript"
version = "13.0.0-alpha.8"
edition = "2024"
rust-version = "1.91"

# The `rescript` executable is the `cli` package, so its build script can use
# this library to compile the runtime into it.
[workspace]
members = ["cli"]
default-members = [".", "cli"]

[dependencies]
ahash = "0.8.3"
anyhow = "1.0.93"
blake3 = "1.3.3"
clap = { version = "4.3", features = ["derive"] }
clap-verbosity-flag = "2.2"
console = "0.15.5"
convert_case = "0.6.0"
env_logger = "0.10"
fs2 = "0.4"
indicatif = "0.17.3"
libc = "0.2"
# The watcher stops on SIGINT, SIGTERM and SIGHUP (not just SIGINT), so that
# the telemetry guard's Drop runs on those signals and buffered OTLP spans get
# flushed before exit, and exits with 128 plus the signal's number.
signal-hook = { version = "0.3", default-features = false }
log = { version = "0.4.17" }
mimalloc = { version = "0.1", default-features = false }
notify = { version = "5.1.0", features = ["serde"] }
rayon = "1.6.1"
num_cpus = "1.17.0"
regex = "1.7.1"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.93" }
serde_ignored = "0.1.11"
serde_path_to_error = "0.1.16"
tempfile = "3.10.1"
rusqlite = { version = "0.32", features = ["bundled", "serialize"] }
rescript-compiler = { path = "../compiler-rust" }

# OpenTelemetry for tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
# default-features disabled to skip metrics/logs support and the internal-logs
# feature we don't need. We only use HTTP/protobuf trace export via blocking
# reqwest — no Tokio runtime required.
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }

[profile.release]
# Keep fat LTO, but use the default 16 codegen units for parallel pre-link
# optimization. Profile-guided builds override this in build_rewatch_pgo.sh.
lto = true

[profile.dev]
# Line tables keep file:line in backtraces but drop variable and type info,
# which keeps the debug build of the linked-in compiler much smaller. For a
# debugger session with locals, build with CARGO_PROFILE_DEV_DEBUG=true.
debug = "line-tables-only"
