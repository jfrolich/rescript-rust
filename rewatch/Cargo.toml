[package]
name = "rescript"
version = "13.0.0-alpha.4"
edition = "2024"
rust-version = "1.91"

[dependencies]
ahash = "0.8.3"
anyhow = "1.0.93"
blake3 = "1.3.3"
clap = { version = "4.3", features = ["derive"] }
clap-verbosity-flag = "2.2"
console = "0.15.5"
convert_case = "0.6.0"
# The "termination" feature extends ctrlc's handler to also catch SIGTERM and
# SIGHUP (not just SIGINT), allowing telemetry shutdown hooks to flush spans
# when the process is terminated by a container or process supervisor.
ctrlc = { version = "3.4.4", features = ["termination"] }
env_logger = "0.10"
futures = "0.3.25"
futures-timer = "3.0.2"
indicatif = "0.17.3"
log = { version = "0.4.17" }
mimalloc = { version = "0.1", default-features = false }
notify = { version = "5.1.0", features = ["serde"] }
rayon = "1.6.1"
num_cpus = "1.17.0"
regex = "1.7.1"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = { version = "1.0.93" }
serde_ignored = "0.1.11"
serde_path_to_error = "0.1.16"
sysinfo = "0.29.10"
tempfile = "3.10.1"
rescript-compiler = { path = "../compiler-rust" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }


[profile.release]
codegen-units = 1
lto = true
