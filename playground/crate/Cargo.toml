[package]
name = "rescript-playground-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
rescript-compiler = { path = "../../compiler-rust", default-features = false, features = ["wasm"] }
